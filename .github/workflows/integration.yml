name: Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: 0da541883f491db78cb80af5dca1dcbfe7a9f715
          path: .tmp/lvce-integration
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.0
      - name: Install application dependencies
        working-directory: .tmp/lvce-integration
        run: npm ci
      - name: Install Chromium
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npx playwright install --with-deps chromium
      - name: Stage Accounts view regression
        run: node packages/e2e-integration/stage-accounts-view-test.mjs .tmp/lvce-integration
      - name: Test Accounts view application rendering
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.accounts-view-open --browser-test=../../../../packages/e2e-integration/scripts/test-accounts-view-layout.mjs
      - name: Remove staged Accounts view regression
        if: always()
        run: node packages/e2e-integration/stage-accounts-view-test.mjs .tmp/lvce-integration --clean
