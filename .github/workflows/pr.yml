name: PR

on:
  pull_request:
    branches: [main]

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-2025-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ runner.arch }}-cacheNodeModules-${{ hashFiles('**/package.json', 'package-lock.json', '.nvmrc', '.github/workflows/*.yml') }}
      - name: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build
      - run: npm run build:static
      - run: npm test
      - run: npm run type-check
      - run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: sudo npx playwright install-deps chromium
      - run: npm run e2e
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: 0
      - run: npm run lint
